short_bio: >-
  <p>
    <strong>Welcome!</strong> I am a doctoral student in Public Administration and Policy at
    <a href="https://www.american.edu/spa/dpap/index.cfm" target="_blank">American University's School of Public Affairs</a>.
    I study policy implementation from a public management perspective. My work focuses on how
    frontline bureaucrats and the citizens they serve form attitudes and make decisions through a behavioral lens.
  </p>
  <p>
    The first line of my research examines how generative AI may reshape bureaucratic discretion and
    accountability and whether it can improve citizen evaluations of government. The second takes an
    institutional perspective and asks how organizational structure shapes policy implementation.
    I answer these questions using experimental and quasi-experimental designs as well as
    computational methods built on large language models.
  </p>
  <p>
    I am currently working on a survey experiment examining how LLMs may influence the moral
    judgment of frontline workers and whether friction can counter their potential risks.
    My research appears in the <em>Journal of Public Administration Research and Theory</em>
    and the <em>Review of Policy Research</em>.
  </p>
  <p>
    Outside of research, I enjoy traveling. You can see where I've been on
    <a href="https://www.google.com/maps/d/viewer?mid=1EL3lmIvsf7OJClETAXOsiJUonQRItdQ" target="_blank">my map</a>.
  </p>

