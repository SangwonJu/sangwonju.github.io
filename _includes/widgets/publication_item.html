{% assign item = include.item %}
<div class="{% unless include.hide_bottom_border %}border-bottom{% endunless %} border-gray py-3 px-4">
    {% if item.cover %}
    {% include widgets/publication_head.html item=item %}
    <div class="pub-with-cover mt-1">
        <div class="pub-with-cover__body">
            {% include widgets/publication_rest.html item=item %}
        </div>
        <a class="pub-cover" href="{{ item.cover_full | default: item.cover | relative_url }}" target="_blank" rel="noopener">
            <img src="{{ item.cover | relative_url }}" alt="{{ item.cover_alt | default: item.title }}" width="640" height="341" loading="lazy">
        </a>
    </div>
    {% else %}
    {% include widgets/publication_body.html item=item %}
    {% endif %}
</div>
